    <script>
(function () {
    const textCache = {};
    function loadRiwaya(r) {
        if (!textCache[r]) {
            textCache[r] = fetch('/data/quran_text/' + r + '.json')
                .then(res => res.ok ? res.json() : { ayat: {} })
                .catch(() => ({ ayat: {} }));
        }
        return textCache[r];
    }

    const glyphAyatCache = {};
    function loadGlyphAyat(slug) {
        if (!glyphAyatCache[slug]) {
            glyphAyatCache[slug] = fetch('/data/glyph_ayat/' + slug + '.json')
                .then(r => r.ok ? r.json() : {})
                .catch(() => ({}));
        }
        return glyphAyatCache[slug];
    }
    const injectedFaces = new Set();
    function pad(n, w) { return ('0000' + n).slice(-w); }
    function interp(tpl, n, w) { return tpl.replace(/\{n\}/g, pad(n, w)); }
    function ensureFace(family, url) {
        const key = family + '|' + url;
        if (injectedFaces.has(key)) return;
        injectedFaces.add(key);
        const s = document.createElement('style');
        s.textContent = "@font-face { font-family: '" + family + "'; src: url('" + url + "') format('truetype'); font-display: swap; }";
        document.head.appendChild(s);
    }

    window.fontCatalog = function (opts) {
        return {
            ...opts,
            filter: 'all',
            surah: 22,
            ayah: 1,
            data: {},       // riwaya   -> { ayat: {...} }
            glyphAyat: {},  // ayat_slug -> { "S:V": [{p, text}, ...] }
            get maxAyah() {
                const s = this.surahs[this.surah];
                return s ? s.ayahs : 286;
            },
            get refLabel() {
                const s = this.surahs[this.surah];
                const name = s ? (this.lang === 'ar' ? s.ar : s.translit) : '';
                return name + ' ' + this.surah + ':' + this.ayah;
            },
            textFor(f) {
                const d = this.data[f.riwaya];
                if (!d) return '…';
                const ref = this.surah + ':' + this.ayah;
                return d.ayat[ref] || '';
            },
            // Glyph fonts: render the selected ayah using per-chunk font-family swaps
            glyphChunksFor(f) {
                if (!f.glyph) return [];
                const book = this.glyphAyat[f.glyph.ayat_slug];
                if (!book) return [];
                const key = this.surah + ':' + this.ayah;
                const chunks = book[key] || [];
                const width = f.glyph.pad || 3;
                return chunks.map(({p, text}) => {
                    const family = interp(f.glyph.family, p, width);
                    const url    = interp(f.glyph.file,   p, width);
                    ensureFace(family, url);
                    return { family, text };
                });
            },
            readHash() {
                const m = window.location.hash.replace(/^#/, '').match(/^(\d+):(\d+)$/);
                if (m) { this.surah = parseInt(m[1], 10); this.ayah = parseInt(m[2], 10); }
            },
            onChange() {
                history.replaceState(null, '', '#' + this.surah + ':' + this.ayah);
            },
            async init() {
                this.readHash();
                window.addEventListener('hashchange', () => this.readHash());
                // Changing surah resets ayah to 1 to avoid out-of-range values.
                this.$watch('surah', () => { this.ayah = 1; this.onChange(); });
                // Preload all riwayat + glyph ayah books in parallel
                await Promise.all([
                    ...this.riwayat.map(async (r) => {
                        this.data[r] = await loadRiwaya(r);
                    }),
                    ...this.glyphAyatSlugs.map(async (slug) => {
                        this.glyphAyat[slug] = await loadGlyphAyat(slug);
                    }),
                ]);
            },
        };
    };
})();
</script>
